<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainbow Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <div class="display">
        <input type="text" id="display" readonly value="0" />
      </div>

      <div class="buttons">
        <!-- Row 1 -->
        <button class="btn red" data-action="clear">C</button>
        <button class="btn orange" data-action="delete">⌫</button>
        <button class="btn yellow operator" data-value="/">÷</button>
        <button class="btn purple operator" data-value="*">×</button>

        <!-- Row 2 -->
        <button class="btn red number" data-value="7">7</button>
        <button class="btn orange number" data-value="8">8</button>
        <button class="btn yellow number" data-value="9">9</button>
        <button class="btn purple operator" data-value="-">−</button>

        <!-- Row 3 -->
        <button class="btn green number" data-value="4">4</button>
        <button class="btn blue number" data-value="5">5</button>
        <button class="btn indigo number" data-value="6">6</button>
        <button class="btn purple operator" data-value="+">+</button>

        <!-- Row 4 -->
        <button class="btn green number" data-value="1">1</button>
        <button class="btn blue number" data-value="2">2</button>
        <button class="btn indigo number" data-value="3">3</button>
        <button class="btn purple equal" data-action="equal">=</button>

        <!-- Row 5 -->
        <button class="btn violet zero number" data-value="0">0</button>
        <button class="btn blue number" data-value=".">.</button>
        <button class="btn purple operator" data-value="%">%</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
